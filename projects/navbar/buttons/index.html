<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Button Collection</title>
  <style>
    * { box-sizing: border-box; } body { display: grid; min-height: 100vh; margin: 0; place-items: center; background: #f8fafc; font-family: Arial, sans-serif; } main { padding: 40px; text-align: center; } section { display: flex; gap: 16px; flex-wrap: wrap; justify-content: center; } button { padding: 12px 22px; border-radius: 8px; cursor: pointer; font: inherit; font-weight: bold; transition: .2s; } .primary { color: white; background: #2563eb; border: 2px solid #2563eb; } .primary:hover { background: #1d4ed8; transform: translateY(-3px); } .outline { color: #2563eb; background: white; border: 2px solid #2563eb; } .outline:hover { color: white; background: #2563eb; } .dark { color: white; background: #0f172a; border: 2px solid #0f172a; } .dark:hover { box-shadow: 0 7px 14px #0f172a55; transform: translateY(-3px); }
  </style>
</head>
<body><main><h1>Button Collection</h1><section><button class="primary">Primary Button</button><button class="outline">Outline Button</button><button class="dark">Dark Button</button></section></main></body>
</html>
