<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profile Card</title>
  <style>
    * { box-sizing: border-box; } body { display: grid; min-height: 100vh; margin: 0; place-items: center; background: #e0f2fe; font-family: Arial, sans-serif; }
    article { width: min(90%, 330px); padding: 32px; text-align: center; background: white; border-radius: 18px; box-shadow: 0 16px 32px #0f172a24; }
    img { width: 112px; height: 112px; object-fit: cover; border: 4px solid #2563eb; border-radius: 50%; background: #bfdbfe; } h1 { margin: 14px 0 5px; color: #0f172a; font-size: 1.5rem; } p { color: #64748b; line-height: 1.6; } a { display: inline-block; padding: 10px 18px; color: white; background: #2563eb; border-radius: 7px; text-decoration: none; font-weight: bold; } a:hover { background: #1d4ed8; transform: translateY(-2px); }
  </style>
</head>
<body>
  <article><img src="profileimg.jpeg" alt="Prabhat Bhainsora"><h1>Prabhat Bhainsora</h1><p>B.Tech CSE student learning full stack development and building practical web projects.</p><a href="mailto:prabhatbhainsora9@gmail.com">Contact Me</a></article>
</body>
</html>
