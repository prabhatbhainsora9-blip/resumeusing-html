<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Navigation Bar</title>
  <style>
    * { box-sizing: border-box; } body { margin: 0; font-family: Arial, sans-serif; background: #f8fafc; } nav { display: flex; align-items: center; justify-content: space-between; padding: 16px 8%; color: white; background: #0f172a; } strong { font-size: 1.25rem; } ul { display: flex; gap: 24px; padding: 0; margin: 0; list-style: none; } a { padding: 8px 0; color: #cbd5e1; text-decoration: none; } a:hover { color: white; border-bottom: 2px solid #38bdf8; } main { padding: 80px 8%; } @media (max-width: 540px) { nav { align-items: flex-start; flex-direction: column; } ul { gap: 14px; flex-wrap: wrap; } }
  </style>
</head>
<body>
  <nav><strong>Prabhat.</strong><ul><li><a href="#home">Home</a></li><li><a href="#about">About</a></li><li><a href="#work">Work</a></li><li><a href="#contact">Contact</a></li></ul></nav>
  <main id="home"><h1>Responsive Navigation Bar</h1><p>Hover over a menu item to see the interaction.</p></main>
</body>
</html>
